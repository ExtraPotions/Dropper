name: Verify userscript

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee test-results.txt
      - name: Archive reviewed source
        if: always()
        run: git archive --format=zip --output=dropper-source.zip HEAD
      - name: Retain verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropper-verification-${{ github.sha }}
          path: |
            dropper-source.zip
            test-results.txt
            dropper.user.js
          retention-days: 7
          if-no-files-found: error
