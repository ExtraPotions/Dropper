name: Verify active-viewing implementation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/active-viewing-integration.yml'

permissions:
  contents: write

concurrency:
  group: dropper-active-viewing-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: contains(github.event.head_commit.message, 'verify active-viewing candidate')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply checked menu geometry correction
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const hash = b => crypto.createHash('sha256').update(b).digest('hex');
          const changes = {
            'src/dropper.user.js': {
              before: '1781192a55f7f747d96eb4dfdcaa400f754a7a683de370fec6273543d1a33e4a',
              after: 'e77818551345611839aa0739db78dd358d0a26693d1a353538547798f8d4ab1c',
              edits: [
                { start: 12595, delete: 0, text: '    // Text wrapping, width transitions, and nested panels can change the menu\n    // after the initial layout. Coalesce resize work without another poll loop.\n    let chromeLayoutFrame = 0;\n    const chromeResizeObserver = new ResizeObserver(() => {\n      if (!host.isConnected || ui?.host !== host) {\n        cancelAnimationFrame(chromeLayoutFrame);\n        chromeResizeObserver.disconnect();\n        return;\n      }\n      if (chromeLayoutFrame) return;\n      chromeLayoutFrame = requestAnimationFrame(() => {\n        chromeLayoutFrame = 0;\n        if (host.isConnected && ui?.host === host) layoutChrome();\n      });\n    });\n    chromeResizeObserver.observe(ui.dock);\n    chromeResizeObserver.observe(shadow.querySelector(".badge-row"));\n' },
                { start: 15084, delete: 1, text: '' },
                { start: 15086, delete: 0, text: '      // Inline width from the previous mode must not determine the measured\n      // height. Constrain the new width and inward space before positioning.\n      ui.dock.style.setProperty("width", `${Math.min(panelWidth, window.innerWidth - 24)}px`, "important");\n      const availableMenuHeight = anchor === "top"\n        ? window.innerHeight - rowBottom - 16\n        : rowTop - 16;\n      ui.dock.style.maxHeight = `${Math.max(0, availableMenuHeight)}px`;\n      ui.dock.style.overflowY = "auto";\n      const menuHeight = ui.dock.offsetHeight || ui.dock.clientHeight || 0;\n' },
                { start: 15090, delete: 1, text: '' },
                { start: 15095, delete: 2, text: '' }
              ]
            },
            'tests/active-viewing-browser.test.cjs': {
              before: '20cd6d329727e8eebfdc1ea1ad862aa6596ee58128c731f772a9109d19da4488',
              after: '9dc0be9b5f7e9636228ace222ed298bd20954927718e8698d86f932e9cb09999',
              edits: [
                { start: 175, delete: 1, text: '    await page.waitForTimeout(300);\n' },
                { start: 179, delete: 1, text: "      const row = root.querySelector('.badge-row').getBoundingClientRect();\n      return { width: rect.width, left: rect.left, right: rect.right, top: rect.top, bottom: rect.bottom, rowTop: row.top, rowBottom: row.bottom, overflow: dock.scrollWidth - dock.clientWidth };\n" },
                { start: 183, delete: 0, text: '    assert.ok(box.top >= 8 && box.bottom <= 892, `${mode} menu stays inside the viewport`);\n    assert.ok(box.bottom <= box.rowTop - 7 || box.top >= box.rowBottom + 7, `${mode} menu does not overlap the progress/launcher row: ${JSON.stringify(box)}`);\n' }
              ]
            }
          };
          for (const [path, change] of Object.entries(changes)) {
            const before = fs.readFileSync(path);
            if (hash(before) !== change.before) throw new Error('Baseline changed: ' + path);
            const lines = before.toString('utf8').match(/[^\n]*\n|[^\n]+$/g) || [];
            for (const edit of [...change.edits].reverse()) lines.splice(edit.start, edit.delete, edit.text);
            fs.writeFileSync(path, lines.join(''));
            if (hash(fs.readFileSync(path)) !== change.after) throw new Error('Applied file checksum mismatch: ' + path);
          }
          NODE
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run all logic and browser regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee test-results.txt
      - name: Verify distribution and unchanged licenses
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'e77818551345611839aa0739db78dd358d0a26693d1a353538547798f8d4ab1c' 'dropper.user.js' | sha256sum -c -
          git diff --exit-code -- LICENSE-CODE.md LICENSE-ASSETS.md NOTICE.md
          sha256sum dropper.user.js src/dropper.user.js LICENSE-CODE.md LICENSE-ASSETS.md NOTICE.md > SHA256SUMS
      - name: Commit verified product files without workflow changes or a release
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git add -- src/dropper.user.js dropper.user.js tests/active-viewing-browser.test.cjs
          git diff --cached --exit-code -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: measure menu height at the active width before positioning'
          git push origin HEAD:main
          git rev-parse HEAD > verified-commit.txt
          git archive --format=zip --output=dropper-source.zip HEAD
      - name: Retain exact build, source, logs, and fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropper-active-viewing-${{ github.sha }}
          path: |
            test-results.txt
            test-artifacts/
            dropper.user.js
            dropper-source.zip
            SHA256SUMS
            verified-commit.txt
          retention-days: 7
          if-no-files-found: error
