name: Integrate Dropper recovery and legacy cleanup
on:
  push:
    branches: [release/recovery-and-legacy-cleanup]
    paths: [.github/workflows/integrate-recovery-cleanup.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: integrate-dropper-recovery-cleanup
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Verify the complete reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          ref = '584e119151b9c751b04acff448c08a8ed57aa0a7'
          chunks = []
          for index in range(4):
              encoded = subprocess.check_output(['gh','api',f'repos/ExtraPotions/exp-core/contents/.maintenance/dropper-final-{index}.b64?ref={ref}','--jq','.content'], text=True)
              chunks.append(base64.b64decode(encoded).decode().strip())
          patch = gzip.decompress(base64.b64decode(''.join(chunks), validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          if digest != '60f6e067d7b7776ac04238ab0c5bec494e6fc1e823136b940bd98a197995ba84': raise RuntimeError('Reviewed patch checksum mismatch: ' + digest)
          pathlib.Path('evidence/reviewed-source.patch').write_bytes(patch)
          print('Verified full reviewed source SHA256:', digest)
          PY
      - name: Preserve the published automatic Core rollout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            pin="$(gh api repos/ExtraPotions/Dropper/contents/vendor/exp-core/PIN --jq .content | base64 --decode)"
            if test "$pin" = v3.4.12 && gh api repos/ExtraPotions/Dropper/releases/tags/v3.3.47 > evidence/core-rollout-release.json 2>/dev/null; then ready=1; break; fi
            sleep 10
          done
          test "$ready" = 1
          git config user.name expDARE
          git config user.email 5340947+ExtraPotions@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          test "$(node -p "require('./package.json').version")" = 3.3.47
          test "$(cat vendor/exp-core/PIN)" = v3.4.12
          git rev-parse origin/main > evidence/rollout-base.txt
          mkdir -p evidence/core-release
          gh release download v3.4.12 -R ExtraPotions/exp-core -p exp-core.js -p manifest.json -D evidence/core-release
          echo 'ffbfa2303e4a4763e00d8ce0c249507ba6009619a18f77c554b3789e9d4c0d0b  evidence/core-release/exp-core.js' | sha256sum --check
          echo '5993f84416e22a4dde7d2f184a29e0d5678c8704d7fa82582452a4c28fe0a832  evidence/core-release/manifest.json' | sha256sum --check
          cmp vendor/exp-core/exp-core.js evidence/core-release/exp-core.js
          cmp vendor/exp-core/manifest.json evidence/core-release/manifest.json
      - name: Apply tested changes without overwriting the rollout
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way --unidiff-zero evidence/reviewed-source.patch
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(node -p "require('./package.json').version")" = 3.3.47
          test "$(cat vendor/exp-core/PIN)" = v3.4.12
      - name: Prepare the product release
        env:
          RELEASE_NOTES_JSON: '["Removes retired width settings, preset CSS and chat-width observers; menu sizing now comes from Core and fits the viewport.","Clears stale earning state when routing is held, records trustworthy manual-arrival evidence, and refreshes reward identity without inventing watch credit.","Uses simultaneous reward timing rather than adding overlapping campaign progress bars; ambiguous dependencies and windows remain unknown.","Separates standby cache maintenance from real observations and rediscoveries, preserving manual playback and navigation protections."]'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-feature-release.cjs
          test "$(node -p "require('./package.json').version")" = 3.3.48
          python3 <<'PY'
          import json,pathlib,re
          file=pathlib.Path('README.md'); version=json.loads(pathlib.Path('package.json').read_text())['version']
          replacement='**'+version+'** uses exp-core 3.4.12 for one shared, viewport-clamped menu size and removes retired width settings and observers. It corrects held routing state, session identity diagnostics, overlapping campaign estimates, and standby freshness reporting while preserving manual viewing, reward identity, and claim safeguards. See [the changelog](CHANGELOG.md) for details.'
          text,count=re.subn(r'(## Current release\n\n).*?(?=\n\n## )',lambda m:m[1]+replacement,file.read_text(),count=1,flags=re.S)
          if count!=1: raise RuntimeError('Expected current release section')
          file.write_text(text)
          PY
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify full regressions, canonical ownership and deterministic build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-exp-core-pin.cjs | tee evidence/core-pin.txt
          git clone --quiet --depth=1 --branch v3.4.12 https://github.com/ExtraPotions/exp-core.git /tmp/released-exp-core
          node /tmp/released-exp-core/scripts/check-core-duplicates.cjs --enforce "$PWD" | tee evidence/ownership.txt
          npm test 2>&1 | tee evidence/tests.txt
          npm run build:check
          node --check src/dropper.user.js
          node --check dropper.user.js
          git diff --check
          sha256sum dropper.user.js src/dropper.user.js > evidence/SHA256SUMS
          npm run build
          sha256sum --check evidence/SHA256SUMS
      - name: Commit only the tested candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/integrate-recovery-cleanup.yml
          git add src tests README.md CHANGELOG.md package.json package-lock.json dropper.user.js
          git -c user.name=expDARE -c user.email=5340947+ExtraPotions@users.noreply.github.com commit -m 'Prepare Dropper 3.3.48 recovery and legacy cleanup'
          git push origin HEAD:refs/heads/release/recovery-and-legacy-cleanup
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=zip --output=evidence/candidate.zip HEAD
          cp dropper.user.js evidence/dropper.user.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dropper-maintenance-${{ github.run_id }}
          path: |
            evidence/
            test-artifacts/
          retention-days: 7
          if-no-files-found: error
