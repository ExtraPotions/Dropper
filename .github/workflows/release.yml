name: Publish release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.event.head_commit.message, 'Release Dropper ')
    uses: ./.github/workflows/verify.yml
    with:
      release: true
    permissions:
      contents: read

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-${{ github.sha }}
          path: .verified-release/
      - name: Check verified artifact identity
        run: |
          set -euo pipefail
          test "$(cat .verified-release/commit.txt)" = "$GITHUB_SHA"
          (cd .verified-release && sha256sum --check SHA256SUMS)
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            version="$(jq -r .version package.json)"
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          version="${TAG#v}"
          awk '
            /^## / { section += 1; if (section > 3) exit }
            { print }
          ' CHANGELOG.md > release-notes.md
          if ! gh release create "$TAG" .verified-release/dropper.user.js .verified-release/dropper-launcher.svg .verified-release/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Dropper $version" --notes-file release-notes.md; then
            sleep 5
            gh release view "$TAG" >/dev/null
          fi
