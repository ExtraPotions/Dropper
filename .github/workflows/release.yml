name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Publish committed assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          tag="v$version"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          fi
          (sha256sum dropper.user.js; cd assets && sha256sum dropper-launcher.svg) > SHA256SUMS
          awk '
            /^## / { section += 1; if (section > 3) exit }
            { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$tag" dropper.user.js assets/dropper-launcher.svg SHA256SUMS \
            --target "$GITHUB_SHA" --title "Dropper $version" --notes-file release-notes.md
