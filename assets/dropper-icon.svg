<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Dropper Icon</title>
  <desc id="desc">A split faceted gem with a diagonal gray to Twitch purple border.</desc>
  <defs>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B9BBC7"/>
      <stop offset="52%" stop-color="#8A6BE8"/>
      <stop offset="100%" stop-color="#9147FF"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171520"/>
      <stop offset="100%" stop-color="#0E0D13"/>
    </linearGradient>
    <linearGradient id="purpleA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9B5FF"/>
      <stop offset="100%" stop-color="#9D57FF"/>
    </linearGradient>
    <linearGradient id="purpleB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A24CFF"/>
      <stop offset="100%" stop-color="#6A21E8"/>
    </linearGradient>
    <linearGradient id="purpleC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B28F4"/>
      <stop offset="100%" stop-color="#4B159E"/>
    </linearGradient>
    <linearGradient id="grayA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AEB0C2"/>
      <stop offset="100%" stop-color="#666A82"/>
    </linearGradient>
    <linearGradient id="grayB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62667E"/>
      <stop offset="100%" stop-color="#343748"/>
    </linearGradient>
    <linearGradient id="grayC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D4051"/>
      <stop offset="100%" stop-color="#222431"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="185" fill="url(#bgGrad)"/>
  <rect x="42" y="42" width="940" height="940" rx="175"
        fill="none" stroke="url(#borderGrad)" stroke-width="28"/>

  <!-- Left purple half -->
  <polygon points="494,210 285,500 430,590" fill="url(#purpleA)"/>
  <polygon points="494,210 430,590 494,470" fill="#9B5AF9"/>
  <polygon points="285,500 285,685 430,590" fill="#8C39F2"/>
  <polygon points="285,685 494,842 430,590" fill="url(#purpleC)"/>
  <polygon points="430,590 494,470 494,842" fill="url(#purpleB)"/>

  <!-- Right graphite half -->
  <polygon points="530,210 739,500 594,590" fill="url(#grayA)"/>
  <polygon points="530,210 594,590 530,470" fill="#6A6E87"/>
  <polygon points="739,500 739,685 594,590" fill="#4E5268"/>
  <polygon points="739,685 530,842 594,590" fill="url(#grayC)"/>
  <polygon points="594,590 530,470 530,842" fill="url(#grayB)"/>

  <!-- Central split -->
  <rect x="502" y="205" width="20" height="650" rx="10" fill="#101017"/>
</svg>